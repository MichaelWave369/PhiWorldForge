name: Genesis CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m phiworldforge validate examples/arclight-room
      - run: python -m phiworldforge pack examples/arclight-room /tmp/arclight-genesis.zip

      - run: python -m phiworldforge catalog --check
      - run: node --check viewer/app.js
